[project]
name = "pdf-knowledge-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hbeemster", email = "herbertbeemster@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.23",
    "langchain-huggingface>=1.2.1",
    "loguru>=0.7.3",
    "optuna>=4.8.0",
    "optuna-dashboard>=0.20.0",
    "pypdf>=6.9.2",
    "sentence-transformers>=5.3.0",
]

[project.scripts]
pdf-knowledge-base = "pdf_knowledge_base:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.8",
]
